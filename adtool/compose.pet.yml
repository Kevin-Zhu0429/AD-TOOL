# Standalone file: docker compose --env-file .env.pet -f compose.pet.yml up -d --build
name: adtool-pet
services:
  pet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        NODE_DISTURL: ${NODE_DISTURL:-}
    image: adtool-pet:latest
    container_name: adtool-pet
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "127.0.0.1:${PET_HOST_PORT:-8081}:8080"
    environment:
      APP_PROFILE: pet
      PORT: 8080
      DATA_DIR: /data
      SESSION_SECRET: ${PET_SESSION_SECRET:?请在 .env.pet 设置独立的 PET_SESSION_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CAPTAIN_API_BASE: ${CAPTAIN_API_BASE:-https://openapi.captainbi.com}
      CAPTAIN_CLIENT_ID: ${PET_CAPTAIN_CLIENT_ID:-}
      CAPTAIN_CLIENT_SECRET: ${PET_CAPTAIN_CLIENT_SECRET:-}
      CAPTAIN_INITIAL_LOOKBACK_DAYS: ${CAPTAIN_INITIAL_LOOKBACK_DAYS:-365}
    volumes:
      - ./data-pet-prod:/data:Z
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
