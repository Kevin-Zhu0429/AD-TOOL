services:
  adtool:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Docker Hub 拉不动时在 .env 里换成加速器地址
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        NODE_DISTURL: ${NODE_DISTURL:-}
    image: adtool:latest
    container_name: adtool
    restart: unless-stopped

    # 容器内进程以宿主机上你自己的 uid/gid 跑,这样 data-prod 归你所有,
    # 看日志、拷备份都不用 sudo。值由 .env 里的 APP_UID/APP_GID 提供
    user: "${APP_UID:-1000}:${APP_GID:-1000}"

    ports:
      # 左边是服务器对外端口(改 .env 里的 HOST_PORT),右边固定 8080
      - "${HOST_PORT:-8080}:8080"

    environment:
      # This branch deploys the pet site on novagaming's existing domain/port.
      APP_PROFILE: pet
      PORT: 8080
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?请先在 adtool/.env 里设置 SESSION_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
      # 宠物店铺的亚马逊 SP-API 凭证(北美卖家账号),不读墨盒的 BRAND<n>_ 配置
      PET_SP_LWA_CLIENT_ID: ${PET_SP_LWA_CLIENT_ID:-}
      PET_SP_LWA_CLIENT_SECRET: ${PET_SP_LWA_CLIENT_SECRET:-}
      PET_SP_LWA_REFRESH_TOKEN: ${PET_SP_LWA_REFRESH_TOKEN:-}
      PET_SP_SELLER_ID: ${PET_SP_SELLER_ID:-}
      PET_SP_BRAND: ${PET_SP_BRAND:-}
      # 网站的 https 地址(如 https://example.com),填了才开启 Claude 连接器 <地址>/mcp
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # 宠物使用独立数据；原 data-prod 墨盒数据库保留，不迁移或覆盖。
      # :Z 是给 CentOS 的 SELinux 打标签,不加可能报 permission denied
      - ./data-pet-prod:/data:Z

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
