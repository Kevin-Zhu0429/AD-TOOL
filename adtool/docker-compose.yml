services:
  adtool:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Docker Hub 拉不动时在 .env 里换成加速器地址
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        NODE_DISTURL: ${NODE_DISTURL:-}
    image: adtool:latest
    container_name: adtool
    restart: unless-stopped

    # 容器内进程以宿主机上你自己的 uid/gid 跑,这样 data-prod 归你所有,
    # 看日志、拷备份都不用 sudo。值由 .env 里的 APP_UID/APP_GID 提供
    user: "${APP_UID:-1000}:${APP_GID:-1000}"

    ports:
      # 左边是服务器对外端口(改 .env 里的 HOST_PORT),右边固定 8080
      - "${HOST_PORT:-8080}:8080"

    # 亚马逊 SP-API 凭证(SPAPI_ 开头的那几行)直接从 .env 读进容器;
    # 多个卖家账号加 _2、_3 后缀即可,不用再改这个文件。下面 environment 里的同名项优先
    env_file:
      - path: .env
        required: false

    environment:
      PORT: 8080
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?请先在 adtool/.env 里设置 SESSION_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # 数据库 + session 全在这。备份就是打包这一个目录
      # :Z 是给 CentOS 的 SELinux 打标签,不加可能报 permission denied
      - ./data-prod:/data:Z

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
